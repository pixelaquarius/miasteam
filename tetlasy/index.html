<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L.ASY Tết 2027 — Đếm Ngược Tết Đinh Mùi</title>
    <meta name="description" content="Đếm ngược Tết Nguyên Đán Đinh Mùi 2027 (06/02/2027) cùng L.ASY Studio: Cày Cuốc, Bóc Quẻ đầu xuân và tương tác giải trí.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-paper: #FAF7F2;
            --bg-elevated: #FFFFFF;
            --bg-subtle: #F3EDE3;
            --border-sand: #E6DDD0;
            --ink-primary: #1C1917;
            --ink-secondary: #575049;
            --ink-muted: #847A6E;
            --crimson: #B93829;
            --crimson-dark: #94281C;
            --crimson-soft: #FDF2F0;
            --gold: #B67E1E;
            --gold-soft: #FBF5E8;
            --shadow-card: 0 2px 4px rgba(28, 25, 23, 0.04), 0 16px 40px rgba(28, 25, 23, 0.07);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-paper);
            background-image:
                radial-gradient(ellipse 75% 50% at 50% 0%, rgba(185, 56, 41, 0.08), transparent),
                radial-gradient(ellipse 50% 40% at 100% 100%, rgba(182, 126, 30, 0.07), transparent);
            color: var(--ink-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            position: relative;
            z-index: 20;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 24px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-sand);
            color: var(--ink-primary);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 1px 3px rgba(28, 25, 23, 0.05);
        }

        .back-link:hover {
            border-color: var(--ink-primary);
            transform: translateX(-2px);
        }

        .year-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--crimson-soft);
            color: var(--crimson);
            border: 1px solid rgba(185, 56, 41, 0.22);
        }

        /* Floating Background */
        #background-animation {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .floating-item {
            position: absolute;
            bottom: -50px;
            animation: floatUp 22s linear infinite;
            opacity: 0.45;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-115vh) rotate(320deg); }
        }

        /* Main Stage */
        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 20px 48px;
            position: relative;
            z-index: 10;
        }

        .studio-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-sand);
            border-radius: 24px;
            box-shadow: var(--shadow-card);
            padding: 40px 36px;
            width: 100%;
            max-width: 680px;
            text-align: center;
        }

        .brand-crest {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px;
            border-radius: 999px;
            background: var(--gold-soft);
            border: 1px solid rgba(182, 126, 30, 0.25);
            color: var(--gold);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2rem, 4.8vw, 3rem);
            font-weight: 700;
            color: var(--ink-primary);
            line-height: 1.15;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        h1 span {
            color: var(--crimson);
            font-style: italic;
        }

        .subtitle {
            font-size: 0.96rem;
            color: var(--ink-secondary);
            margin-bottom: 32px;
        }

        .subtitle strong {
            color: var(--ink-primary);
            font-weight: 600;
        }

        /* Countdown Grid */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 30px;
        }

        .time-box {
            background: var(--bg-paper);
            border: 1px solid var(--border-sand);
            border-radius: 16px;
            padding: 18px 10px;
        }

        .time-val {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 700;
            color: var(--crimson);
            line-height: 1.1;
        }

        .time-label {
            display: block;
            margin-top: 6px;
            font-size: 0.74rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--ink-muted);
        }

        /* Action Buttons */
        .actions-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .action-btn {
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 13px 16px;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .btn-motivate {
            background: var(--gold-soft);
            color: #7D520A;
            border-color: rgba(182, 126, 30, 0.35);
        }

        .btn-motivate:hover {
            background: #F5E6C8;
            box-shadow: 0 6px 16px rgba(182, 126, 30, 0.16);
        }

        .btn-fortune {
            background: var(--crimson);
            color: #FFFFFF;
        }

        .btn-fortune:hover {
            background: var(--crimson-dark);
            box-shadow: 0 6px 16px rgba(185, 56, 41, 0.24);
        }

        .btn-quit {
            background: var(--bg-subtle);
            color: var(--ink-secondary);
            border-color: var(--border-sand);
        }

        .btn-quit:hover {
            background: #EAE2D5;
            color: var(--ink-primary);
        }

        /* Result Areas */
        .hidden {
            display: none !important;
        }

        .message-box {
            background: var(--gold-soft);
            border: 1px dashed rgba(182, 126, 30, 0.45);
            border-radius: 14px;
            padding: 16px 20px;
            color: #6B4408;
            font-size: 0.98rem;
            font-weight: 500;
            font-style: italic;
            line-height: 1.55;
        }

        .fortune-card {
            background: var(--crimson-soft);
            border: 1px solid rgba(185, 56, 41, 0.25);
            border-radius: 16px;
            padding: 20px 22px;
            position: relative;
            overflow: hidden;
        }

        .fortune-tag {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--crimson);
            margin-bottom: 6px;
        }

        .fortune-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--crimson-dark);
            margin-bottom: 4px;
        }

        .fortune-sub {
            font-size: 0.94rem;
            color: var(--ink-secondary);
            line-height: 1.5;
        }

        /* Animations */
        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(28, 25, 23, 0.65);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-sand);
            border-radius: 22px;
            padding: 32px 28px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
        }

        .modal-emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--crimson);
            margin-bottom: 14px;
        }

        .modal-quote {
            background: var(--gold-soft);
            border: 1px solid rgba(182, 126, 30, 0.25);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 0.96rem;
            color: var(--ink-primary);
            line-height: 1.55;
        }

        .modal-quote strong {
            display: block;
            margin-top: 6px;
            color: var(--crimson);
            font-size: 1.04rem;
        }

        .modal-close-btn {
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: 12px;
            background: var(--ink-primary);
            color: #FFFFFF;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 0.94rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .modal-close-btn:hover {
            background: #332E2A;
        }

        @media (max-width: 600px) {
            .studio-card {
                padding: 28px 20px;
            }
            .countdown-grid {
                gap: 8px;
            }
            .time-box {
                padding: 14px 6px;
            }
            .actions-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="background-animation" aria-hidden="true"></div>

    <nav class="top-bar">
        <a href="../index.html" class="back-link">← L.ASY Studio</a>
        <span class="year-pill">ĐINH MÙI • 2027</span>
    </nav>

    <main class="stage">
        <div class="studio-card">
            <div class="brand-crest">L.ASY • TẾT NGUYÊN ĐÁN</div>

            <h1>Đếm Ngược <span>Tết 2027</span></h1>
            <p class="subtitle">
                Cùng nhau về đích ngày <strong>06/02/2027</strong> (Mùng 1 Tết Đinh Mùi)
            </p>

            <div class="countdown-grid" aria-label="Bộ đếm ngược tới Tết 2027">
                <div class="time-box">
                    <span id="days" class="time-val">00</span>
                    <span class="time-label">Ngày</span>
                </div>
                <div class="time-box">
                    <span id="hours" class="time-val">00</span>
                    <span class="time-label">Giờ</span>
                </div>
                <div class="time-box">
                    <span id="minutes" class="time-val">00</span>
                    <span class="time-label">Phút</span>
                </div>
                <div class="time-box">
                    <span id="seconds" class="time-val">00</span>
                    <span class="time-label">Giây</span>
                </div>
            </div>

            <div class="actions-row">
                <button id="motivationBtn" class="action-btn btn-motivate" type="button">
                    💪 Cày Cuốc
                </button>
                <button id="fortuneBtn" class="action-btn btn-fortune" type="button">
                    🥠 Bóc Quẻ
                </button>
                <button id="quitBtn" class="action-btn btn-quit" type="button">
                    🚪 Nghỉ Việc
                </button>
            </div>

            <div id="messageArea" class="message-box hidden" role="status"></div>

            <div id="fortuneArea" class="fortune-card hidden" role="status">
                <span class="fortune-tag">Lời Phán Đầu Xuân</span>
                <p id="fortuneText" class="fortune-title"></p>
                <p id="fortuneSub" class="fortune-sub"></p>
            </div>
        </div>
    </main>

    <!-- Ms Grace Modal -->
    <div id="graceModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="graceModalTitle">
        <div id="graceModalCard" class="modal-card animate-pop">
            <div class="modal-emoji">😤⛓️</div>
            <h2 id="graceModalTitle" class="modal-title">Định Mệnh Rồi!</h2>
            <div class="modal-quote">
                "Em định bỏ chị đi đâu?"
                <strong>Ở lại với Ms Grace cả đời nhé! ❤️</strong>
            </div>
            <button id="closeModalBtn" class="modal-close-btn" type="button">
                Dạ em biết lỗi rồi 😭
            </button>
        </div>
    </div>

    <script>
        // --- Hiệu ứng Sản phẩm & Tết Bay ---
        const items = ['💄', '👠', '👜', '👗', '🧧', '🏮', '🌸', '🌼', '🍍', '💰', '📦', '🛒'];
        const bgContainer = document.getElementById('background-animation');

        function createFloatingItem() {
            const el = document.createElement('div');
            el.innerText = items[Math.floor(Math.random() * items.length)];
            el.classList.add('floating-item');
            el.style.left = Math.random() * 92 + 'vw';
            el.style.animationDuration = (Math.random() * 10 + 16) + 's';
            el.style.fontSize = (Math.random() * 0.9 + 1.3) + 'rem';
            bgContainer.appendChild(el);
            setTimeout(() => el.remove(), 26000);
        }
        setInterval(createFloatingItem, 2000);
        for (let i = 0; i < 6; i++) createFloatingItem();

        // --- Logic Đếm Ngược (Mùng 1 Tết Đinh Mùi 2027: 06/02/2027) ---
        function updateCountdown() {
            const now = new Date().getTime();
            const target2027 = new Date("Feb 06, 2027 00:00:00").getTime();
            const distance = target2027 - now;

            if (distance <= 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- Data ---
        const motivationQuotes = [
            "Làm nhiệt tình, cuối năm hình mình lên bảng vàng!",
            "Deadline dí? Chạy nhanh hơn deadline là được!",
            "Cố lên em! Túi hiệu đang vẫy gọi!",
            "Ms Grace tin tưởng em (và KPI của em).",
            "Đừng để việc hôm nay chảy sang năm sau!",
            "Khách hàng khó tính là khách hàng... nhiều tiền.",
            "Tập trung cao độ, tối về ngủ ngon!",
            "Mỗi đơn hàng là một niềm vui (và hoa hồng).",
            "Thần thái L.ASY: Tự tin, Chăm chỉ, Sang chảnh.",
            "Nghèo thì lâu, giàu thì mấy hồi (nếu chăm).",
            "Sắp Tết 2027 rồi, bánh chưng cần có nhân thịt!",
            "Áp lực tạo nên kim cương (hoặc tạo nên nếp nhăn, nhớ dưỡng da).",
            "Hãy làm việc như thể bạn là cổ đông lớn nhất.",
            "Tương lai khóc hay cười phụ thuộc vào độ lười quá khứ.",
            "Vượt qua KPI, đời em sẽ nở hoa!"
        ];

        const fortunes = [
            { text: "Đại Cát", sub: "Tiền vào cửa trước... lẻn ngay ra cửa sau." },
            { text: "Đào Hoa", sub: "Ra ngõ gặp người yêu... cũ đòi nợ 500k." },
            { text: "Thăng Quan", sub: "Sếp hứa tăng lương... bằng niềm tin và hy vọng." },
            { text: "Bình An", sub: "Cả ngày không ai réo tên... vì công ty mất mạng." },
            { text: "Tài Lộc", sub: "Trúng số độc đắc... ở trong giấc mơ trưa nay." },
            { text: "May Mắn", sub: "Nhặt được ví tiền... của chính mình rớt 5 phút trước." },
            { text: "Sức Khỏe", sub: "Ăn được ngủ được... lăn còn nhanh hơn đi bộ." },
            { text: "Hỷ Sự", sub: "Crush nhắn tin 'muốn gặp em'... để mời đi đám cưới nó." },
            { text: "Như Ý", sub: "Cầu mưa được nắng, cầu tiền được... việc." },
            { text: "Vinh Hoa", sub: "Được lên tivi... mục tìm trẻ lạc." },
            { text: "Phú Quý", sub: "Vàng đeo đầy người... toàn vàng giả mua Shopee." },
            { text: "Cát Tường", sub: "Mọi việc suôn sẻ... trừ cái deadline chiều nay." },
            { text: "Lợi Lộc", sub: "Bạn bè lì xì... toàn voucher hết hạn sử dụng." },
            { text: "Tương Phùng", sub: "Gặp lại cố nhân... nó nhờ mượn tiền đóng hụi." },
            { text: "Yên Vui", sub: "Cười cả ngày... vì sếp đi vắng (nhưng mai sếp về)." }
        ];

        // --- Interactions ---
        const motivationBtn = document.getElementById('motivationBtn');
        const fortuneBtn = document.getElementById('fortuneBtn');
        const quitBtn = document.getElementById('quitBtn');

        const messageArea = document.getElementById('messageArea');
        const fortuneArea = document.getElementById('fortuneArea');
        const fortuneText = document.getElementById('fortuneText');
        const fortuneSub = document.getElementById('fortuneSub');

        const graceModal = document.getElementById('graceModal');
        const graceModalCard = document.getElementById('graceModalCard');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function hideAllAreas() {
            messageArea.classList.add('hidden');
            fortuneArea.classList.add('hidden');
        }

        motivationBtn.addEventListener('click', () => {
            hideAllAreas();
            const randomQuote = motivationQuotes[Math.floor(Math.random() * motivationQuotes.length)];
            messageArea.innerText = `✨ "${randomQuote}"`;
            messageArea.classList.remove('hidden');
            messageArea.classList.remove('animate-pop');
            void messageArea.offsetWidth;
            messageArea.classList.add('animate-pop');
        });

        fortuneBtn.addEventListener('click', () => {
            hideAllAreas();
            fortuneArea.classList.remove('hidden');
            fortuneText.innerText = "⏳ Đang lắc quẻ...";
            fortuneSub.innerText = "";

            setTimeout(() => {
                const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
                fortuneText.innerText = `🌟 Quẻ ${randomFortune.text}`;
                fortuneSub.innerText = randomFortune.sub;
                fortuneArea.classList.remove('animate-pop');
                void fortuneArea.offsetWidth;
                fortuneArea.classList.add('animate-pop');
            }, 550);
        });

        quitBtn.addEventListener('click', () => {
            graceModal.classList.remove('hidden');
            graceModalCard.classList.remove('shake');
            void graceModalCard.offsetWidth;
            graceModalCard.classList.add('shake');
        });

        closeModalBtn.addEventListener('click', () => {
            graceModal.classList.add('hidden');
            hideAllAreas();
            messageArea.innerText = "Ngoan! Quay lại làm việc đi nhé. 👋";
            messageArea.classList.remove('hidden');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Công Cụ L.ASY</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --hover-color: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .tool-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-color: var(--primary-color);
        }

        .tool-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
            background: #eff6ff;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .tool-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .tool-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Danh Sách Công Cụ</h1>
            <p>Chọn một tiện ích bên dưới để bắt đầu sử dụng</p>
        </div>

        <div class="grid-container">
            <!-- Thẻ Tool 1: tetlasy -->
            <a href="./tetlasy/index.html" class="tool-card">
                <div class="tool-icon">🧧</div>
                <div class="tool-title">Tết L.ASY</div>
                <div class="tool-desc">Quản lý nội dung, hình ảnh và chiến dịch cho sự kiện Tết.</div>
            </a>

            <!-- Thẻ Tool 2: ghepanh -->
            <a href="./ghepanh/index.html" class="tool-card">
                <div class="tool-icon">🖼️</div>
                <div class="tool-title">Ghép Ảnh</div>
                <div class="tool-desc">Tiện ích xử lý, điều chỉnh và ghép hình ảnh nhanh chóng.</div>
            </a>

            <!-- Mẫu thẻ dự phòng cho công cụ mới -->
            <a href="#" class="tool-card" style="opacity: 0.6; border-style: dashed;">
                <div class="tool-icon" style="background: #f1f5f9;">➕</div>
                <div class="tool-title" style="color: #64748b;">Công cụ mới</div>
                <div class="tool-desc">Khu vực dành cho các tiện ích đang được phát triển.</div>
            </a>
        </div>
    </div>
</body>
</html>
